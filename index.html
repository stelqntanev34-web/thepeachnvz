<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прасковата | Ultimate</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #fff7f0;
            overflow-x: hidden;
        }

        /* 🌈 FLOATING ORBS BACKGROUND */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: #ff8c42;
            top: 10%;
            left: 10%;
        }

        .orb2 {
            width: 250px;
            height: 250px;
            background: #ffb26b;
            bottom: 10%;
            right: 10%;
            animation-duration: 12s;
        }

        /* HERO */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(120deg, rgba(255, 140, 66, 0.7), rgba(255, 180, 120, 0.5)),
                url("images/hero.jpg");
            background-size: cover;
            background-position: center;
        }

        /* ✨ GLASS CARD */
        .hero-box {
            padding: 40px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pop 1.5s ease;
        }

        .hero h1 {
            font-size: 80px;
            margin: 0;
            animation: glow 2s infinite alternate;
        }

        .hero p {
            font-size: 22px;
        }

        /* 🔘 BUTTON */
        .btn {
            margin-top: 20px;
            padding: 15px 35px;
            background: #ff8c42;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 140, 66, 0.6);
        }

        .btn:hover {
            transform: scale(1.15) rotate(-2deg);
            box-shadow: 0 0 40px rgba(255, 140, 66, 0.9);
        }

        /* 📦 SECTIONS */
        section {
            padding: 80px 10%;
        }

        /* 🧡 TITLES */
        h2 {
            text-align: center;
            color: #ff8c42;
            font-size: 40px;
            margin-bottom: 40px;
            animation: fadeUp 1s ease;
        }

        /* 📌 CARDS */
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: 0.5s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff8c42, transparent);
            top: 0;
            left: -100%;
            transition: 0.5s;
        }

        .card:hover::before {
            left: 0;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.05);
        }

        /* 📸 IMAGES */
        .img-card img {
            width: 100%;
            border-radius: 20px;
            transition: 0.5s;
        }

        .img-card:hover img {
            transform: scale(1.2) rotate(2deg);
        }

        /* ✨ ANIMATIONS */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-40px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff8c42;
            }

            to {
                text-shadow: 0 0 30px #ffb26b;
            }
        }

        @keyframes pop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 📍 CONTACT */
        .contact {
            background: linear-gradient(135deg, #ff8c42, #ffb26b);
            color: white;
            text-align: center;
            padding: 60px 10%;
            animation: fadeUp 1s ease;
        }

        /* 🦶 FOOTER */
        footer {
            text-align: center;
            padding: 25px;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

    <!-- FLOATING ORBS -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- HERO -->
    <div class="hero">
        <div class="hero-box">
            <h1>🍑 Прасковата</h1>
            <p>Нежна атмосфера • Вкусна храна • Нова Загора</p>
            <a class="btn" href="tel:0888119888">📞 Обади се</a>
        </div>
    </div>

    <!-- INFO -->
    <section>
        <h2>За нас</h2>

        <div class="card">📍 ул. „14-та Януари“ 69</div><br>
        <div class="card">⭐ 4.5 / 5 рейтинг</div><br>
        <div class="card">💶 5 – 20 €</div><br>
        <div class="card">⏰ Отворено до 22:00</div>

    </section>

    <!-- GALLERY -->
    <section>
        <h2>Галерия</h2>

        <div class="card img-card">
            <img src="images/hero.jpg">
        </div>

    </section>

    <!-- CONTACT -->
    <div class="contact">
        <h2>Свържете се с нас</h2>
        <p>📍 Нова Загора</p>
        <p>📞 088 811 9888</p>
    </div>

    <footer>
        © 2026 Прасковата
    </footer>

</body>

</html>
